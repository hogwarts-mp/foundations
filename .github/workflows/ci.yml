name: Foundations CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Foundations
        run: npm run verify

      - name: Upload runtime pack
        uses: actions/upload-artifact@v7
        with:
          name: hmp-foundations
          path: build/hmp-foundations
          if-no-files-found: error

      - name: Upload gamemodes pack
        uses: actions/upload-artifact@v7
        with:
          name: hmp-gamemodes
          path: build/hmp-gamemodes
          # Built only once a gamemode exists.
          if-no-files-found: ignore
