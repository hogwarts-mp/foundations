name: Release Foundations

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build runtime pack
        run: |
          npm ci
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          npm run verify

      - name: Archive runtime pack
        run: |
          cd build
          zip -r "../hmp-foundations-${GITHUB_REF_NAME}.zip" hmp-foundations
          if [ -d hmp-gamemodes ]; then zip -r "../hmp-gamemodes-${GITHUB_REF_NAME}.zip" hmp-gamemodes; fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("hmp-foundations-${GITHUB_REF_NAME}.zip")
          if [ -f "hmp-gamemodes-${GITHUB_REF_NAME}.zip" ]; then assets+=("hmp-gamemodes-${GITHUB_REF_NAME}.zip"); fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --generate-notes
