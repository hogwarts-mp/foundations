<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @font-face { font-family: "Cinzel"; src: url("./fonts/Cinzel-Variable.ttf") format("truetype"); font-style: normal; font-weight: 400 900; font-display: swap; }
      @font-face { font-family: "Spectral"; src: url("./fonts/Spectral-Regular.ttf") format("truetype"); font-style: normal; font-weight: 400; font-display: swap; }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      button, input, textarea { font: inherit; }
      .hmp-hover { transition: background .08s ease, border-color .08s ease, filter .08s ease; }
      .hmp-hover:hover, .hmp-hover:focus-visible { border-color: rgba(201,162,90,.58) !important; filter: brightness(1.07); outline: none; }
      @keyframes specks { 0%,100% { transform: translateY(0); opacity:.2 } 50% { transform:translateY(-22px); opacity:.85 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./creator.js"></script>
  </body>
</html>
