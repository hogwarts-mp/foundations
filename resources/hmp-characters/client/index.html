<!doctype html>
<!--
  Foundations adaptation of the HogwartsMP wardrobe selector. Character cards arrive first, followed
  by locally rendered portraits as each saved appearance finishes capturing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      @font-face { font-family: "Cinzel"; src: url("./fonts/Cinzel-Variable.ttf") format("truetype"); font-style: normal; font-weight: 400 900; font-display: swap; }
      @font-face { font-family: "Spectral"; src: url("./fonts/Spectral-Regular.ttf") format("truetype"); font-style: normal; font-weight: 400; font-display: swap; }
      :root {
        --window: #15120c; --card: #16120b; --well: #0e0b07;
        --accent: #c9a25a; --bright: #d8b56b;
        --heading: #f0e3c2; --body: #d5c8a9; --muted: #9c8f74;
        --danger: #e0655a; --hair: rgba(201, 162, 90, 0.14);
        --cinzel: "Cinzel", Georgia, serif;
        --spectral: "Spectral", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        display: grid; place-items: center; font-family: var(--spectral); color: var(--body);
        background: radial-gradient(1100px 700px at 50% 20%, rgba(201, 162, 90, 0.07), transparent 62%), rgba(6, 5, 3, 0.82);
      }
      #shell { width: min(1100px, 92vw); max-height: 88vh; display: flex; flex-direction: column; align-items: center; }
      .eyebrow { font-family: var(--cinzel); font-size: 10px; letter-spacing: 0.32em; color: #b89a64; text-transform: uppercase; }
      h1 { font-family: var(--cinzel); font-weight: 600; font-size: 28px; letter-spacing: 0.06em; color: var(--heading); margin: 8px 0 4px; }
      .hint { font-size: 13px; color: var(--muted); margin: 0; }
      #slots { margin: 6px 0 20px; color: #6f654f; font-family: var(--cinzel); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; }

      #grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px;
        width: 100%; overflow-y: auto; padding: 4px 6px 24px;
      }
      #grid::-webkit-scrollbar { width: 8px; }
      #grid::-webkit-scrollbar-thumb { background: rgba(201, 162, 90, 0.2); border-radius: 4px; }

      .card {
        position: relative; padding: 0; color: inherit; text-align: inherit; font: inherit;
        background: var(--card); border: 1px solid var(--hair); border-radius: 6px; overflow: hidden;
        cursor: pointer; transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      }
      .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: rgba(201, 162, 90, 0.45); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); outline: none; }
      .card.active { border-color: var(--accent); }
      .shot { position: relative; aspect-ratio: 1 / 1; background: var(--well); display: grid; place-items: center; }
      .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .spinner {
        width: 22px; height: 22px; border: 2px solid rgba(201, 162, 90, 0.25); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .initials { font-family: var(--cinzel); font-size: 30px; color: #5e553f; letter-spacing: 0.08em; }
      .badge {
        position: absolute; z-index: 2; top: 8px; right: 8px; font-family: var(--cinzel); font-size: 9px;
        letter-spacing: 0.18em; text-transform: uppercase; color: #1a1306; background: var(--bright);
        border-radius: 3px; padding: 3px 7px;
      }
      .badge.last { color: #cbbfa4; background: #4a4335; }
      .name {
        font-family: var(--cinzel); font-size: 14px; letter-spacing: 0.04em; color: var(--heading);
        padding: 12px 14px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .slot { padding: 0 14px 12px; color: #716750; font-family: var(--cinzel); font-size: 8px; letter-spacing: 0.16em; text-align: center; text-transform: uppercase; }
      .del {
        position: absolute; z-index: 3; top: 6px; left: 6px; font-family: var(--cinzel); font-size: 12px; line-height: 1;
        color: var(--muted); background: rgba(12, 10, 6, 0.72); border: 1px solid var(--hair); border-radius: 3px;
        padding: 3px 6px; cursor: pointer; opacity: 0; transition: opacity 0.12s ease, color 0.12s ease;
      }
      .card:hover .del, .del:focus-visible, .del.armed { opacity: 1; }
      .del:hover, .del.armed { color: var(--danger); border-color: rgba(224, 101, 90, 0.6); }
      .del.armed { letter-spacing: 0.1em; }
      .export {
        position: absolute; z-index: 3; right: 8px; bottom: 8px; font-family: var(--cinzel); font-size: 9px;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--body); background: rgba(12, 10, 6, 0.82);
        border: 1px solid var(--hair); border-radius: 3px; padding: 6px 8px; cursor: pointer;
        opacity: 0; transition: opacity 0.12s ease, color 0.12s ease, border-color 0.12s ease;
      }
      .card:hover .export, .export:focus-visible { opacity: 1; }
      .export:hover, .export:focus-visible { color: var(--heading); border-color: rgba(201, 162, 90, 0.58); outline: none; }
      .export:disabled { cursor: wait; color: #655d4b; border-color: rgba(201, 162, 90, 0.08); }

      .card.new { border-style: dashed; border-color: rgba(201, 162, 90, 0.3); background: transparent; }
      .card.new .shot { background: rgba(201, 162, 90, 0.03); }
      .card.new .plus { font-size: 46px; line-height: 1; color: var(--accent); font-family: var(--cinzel); }
      .card.new .name { padding-bottom: 12px; color: var(--muted); }

      #empty { font-size: 14px; color: var(--muted); text-align: center; padding: 8px 0 20px; }
      #close {
        margin-top: 4px; font-family: var(--cinzel); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--muted); background: none; border: 0; cursor: pointer; padding: 8px 12px;
      }
      #close:hover, #close:focus-visible { color: var(--heading); outline: none; }
      #error { min-height: 20px; margin-top: 4px; color: var(--danger); font-size: 13px; text-align: center; }
      #export-modal {
        position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 28px;
        background: rgba(4, 3, 2, 0.82); backdrop-filter: blur(4px);
      }
      .export-panel {
        width: min(700px, 92vw); max-height: 86vh; display: flex; flex-direction: column; gap: 14px;
        padding: 24px; background: var(--window); border: 1px solid rgba(201, 162, 90, 0.32);
        border-radius: 7px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.72);
      }
      .export-title { font-family: var(--cinzel); font-size: 19px; color: var(--heading); letter-spacing: 0.05em; }
      .export-help { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
      #export-json {
        width: 100%; min-height: 320px; resize: vertical; padding: 14px; color: #d9cba9; background: #0b0906;
        border: 1px solid var(--hair); border-radius: 4px; outline: none; font: 12px/1.5 ui-monospace, monospace;
      }
      .export-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
      .export-actions button {
        padding: 9px 13px; color: var(--body); background: #100d08; border: 1px solid var(--hair);
        border-radius: 4px; font-family: var(--cinzel); font-size: 10px; letter-spacing: 0.12em; cursor: pointer;
      }
      .export-actions button:hover, .export-actions button:focus-visible { color: var(--heading); border-color: rgba(201, 162, 90, 0.55); outline: none; }
      #copy-export { color: #1a1306; background: var(--bright); border-color: var(--bright); }
      #export-status { flex: 1; color: var(--muted); font-size: 12px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="shell">
      <div class="eyebrow" id="eyebrow">The Wardrobe</div>
      <h1 id="title">Choose Your Wizard</h1>
      <p class="hint" id="hint">Every story begins with a name.</p>
      <div id="slots"></div>
      <div id="empty" hidden>Nothing hanging in here yet.</div>
      <section id="grid" aria-live="polite"></section>
      <button id="close" type="button">Close</button>
      <div id="error" role="status"></div>
    </main>

    <section id="export-modal" hidden role="dialog" aria-modal="true" aria-labelledby="export-title">
      <div class="export-panel">
        <div class="eyebrow">Portable Character Look</div>
        <div class="export-title" id="export-title">Export JSON</div>
        <p class="export-help">Copy this look or save it as a file. It can be imported from any page of the character creator.</p>
        <textarea id="export-json" readonly spellcheck="false"></textarea>
        <div class="export-actions">
          <span id="export-status" role="status"></span>
          <button id="close-export" type="button">Close</button>
          <button id="download-export" type="button">Download</button>
          <button id="copy-export" type="button">Copy JSON</button>
        </div>
      </div>
    </section>

    <script>
      const send = (event, payload) => callEvent(event, JSON.stringify(payload || {}));
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const close = document.getElementById("close");
      const error = document.getElementById("error");
      const exportModal = document.getElementById("export-modal");
      const exportTitle = document.getElementById("export-title");
      const exportJson = document.getElementById("export-json");
      const exportStatus = document.getElementById("export-status");
      let exportName = "character-look";
      let model = { characters: [], activeCharacterId: null, lastCharacterId: null, limit: 4 };

      const initials = (name) => String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((word) => word[0].toUpperCase()).join("") || "?";

      function characterCard(character) {
        const card = document.createElement("article");
        const active = character.id === model.activeCharacterId;
        const last = !active && character.id === model.lastCharacterId;
        card.className = "card" + (active ? " active" : "");
        card.tabIndex = 0;
        card.dataset.characterId = String(character.id);

        const shot = document.createElement("div");
        shot.className = "shot";
        const spinner = document.createElement("div");
        spinner.className = "spinner";
        shot.appendChild(spinner);
        if (active || last) {
          const badge = document.createElement("div");
          badge.className = "badge" + (last ? " last" : "");
          badge.textContent = active ? "Active" : "Last played";
          shot.appendChild(badge);
        }

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = character.name;
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.textContent = `Character slot ${character.slot}`;
        card.append(shot, name, slot);

        const exportButton = document.createElement("button");
        exportButton.type = "button";
        exportButton.className = "export";
        exportButton.dataset.characterId = String(character.id);
        exportButton.textContent = "Export JSON";
        exportButton.title = "Look is still loading";
        exportButton.disabled = true;
        exportButton.addEventListener("click", (event) => {
          event.stopPropagation();
          send("export", { characterId: character.id });
        });
        shot.appendChild(exportButton);

        const choose = () => send("select", { characterId: character.id });
        card.addEventListener("click", choose);
        card.addEventListener("keydown", (event) => {
          if (event.target !== card) return;
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); choose(); }
        });

        if (model.allowDelete && !active) {
          const del = document.createElement("button");
          del.type = "button";
          del.className = "del";
          del.textContent = "×";
          del.title = `Delete ${character.name}`;
          del.addEventListener("click", (event) => {
            event.stopPropagation();
            if (del.dataset.armed) send("delete", { characterId: character.id });
            else { del.dataset.armed = "1"; del.textContent = "Sure?"; del.classList.add("armed"); }
          });
          shot.appendChild(del);
        }
        return card;
      }

      function newCard() {
        const card = document.createElement("article");
        card.className = "card new";
        card.tabIndex = 0;
        card.innerHTML = '<div class="shot"><div class="plus">+</div></div><div class="name">New Character</div>';
        const create = () => send("create");
        card.addEventListener("click", create);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); create(); }
        });
        return card;
      }

      function render() {
        document.getElementById("eyebrow").textContent = model.mode === "join" ? "Welcome Back" : "The Wardrobe";
        document.getElementById("title").textContent = model.title || "Choose Your Wizard";
        document.getElementById("hint").textContent = model.subtitle || "Every story begins with a name.";
        document.getElementById("slots").textContent = `${model.characters.length} of ${model.limit} character slots filled`;
        close.hidden = !model.canClose;
        error.textContent = "";
        grid.textContent = "";
        for (const character of model.characters) grid.appendChild(characterCard(character));
        if (!model.full) grid.appendChild(newCard());
        empty.hidden = model.characters.length > 0;
      }

      function applyPortrait(characterId, src) {
        const id = Number(characterId);
        const card = grid.querySelector(`.card[data-character-id="${id}"]`);
        if (!card) return;
        const shot = card.querySelector(".shot");
        const stale = shot.querySelector(".spinner, .initials, img");
        if (stale) stale.remove();
        if (src) {
          const image = document.createElement("img");
          image.src = src;
          image.alt = "";
          shot.prepend(image);
        } else {
          const character = model.characters.find((candidate) => candidate.id === id);
          const fallback = document.createElement("div");
          fallback.className = "initials";
          fallback.textContent = initials(character && character.name);
          shot.prepend(fallback);
        }
      }

      function setExportState(characterId, available) {
        const button = grid.querySelector(`.export[data-character-id="${Number(characterId)}"]`);
        if (!button) return;
        button.disabled = !available;
        button.title = available ? "Export this character's JSON look" : "No JSON look is available";
      }

      function safeFileName(name) {
        return String(name || "character-look").normalize("NFKD").replace(/[^a-z0-9_-]+/gi, "-").replace(/^-+|-+$/g, "").toLowerCase() || "character-look";
      }

      function closeExport() {
        exportModal.hidden = true;
        exportStatus.textContent = "";
      }

      async function copyExport() {
        let copied = false;
        try {
          await navigator.clipboard.writeText(exportJson.value);
          copied = true;
        } catch (_) {
          exportJson.focus();
          exportJson.select();
          try { copied = document.execCommand("copy"); } catch (_) { copied = false; }
        }
        exportStatus.textContent = copied ? "Copied to clipboard." : "Select the text and copy it manually.";
      }

      function downloadExport() {
        const url = URL.createObjectURL(new Blob([exportJson.value], { type: "application/json" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = `${safeFileName(exportName)}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        exportStatus.textContent = "Download started.";
      }

      window.addEventListener("hmp-characters:model", (event) => {
        model = event.detail || model;
        render();
      });
      window.addEventListener("hmp-characters:portrait", (event) => {
        const detail = event.detail || {};
        applyPortrait(detail.characterId, detail.src);
      });
      window.addEventListener("hmp-characters:export-state", (event) => {
        const detail = event.detail || {};
        setExportState(detail.characterId, detail.available === true);
      });
      window.addEventListener("hmp-characters:export", (event) => {
        const detail = event.detail || {};
        exportName = detail.name || "character-look";
        exportTitle.textContent = `Export ${exportName}`;
        exportJson.value = detail.json || "";
        exportStatus.textContent = "";
        exportModal.hidden = false;
        exportJson.focus();
      });
      window.addEventListener("hmp-characters:error", (event) => {
        error.textContent = event.detail?.message || "The action could not be completed.";
      });

      close.addEventListener("click", () => send("close"));
      document.getElementById("close-export").addEventListener("click", closeExport);
      document.getElementById("copy-export").addEventListener("click", copyExport);
      document.getElementById("download-export").addEventListener("click", downloadExport);
      exportModal.addEventListener("click", (event) => { if (event.target === exportModal) closeExport(); });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !exportModal.hidden) { closeExport(); return; }
        if (event.key === "Escape" && model.canClose) send("close");
      });
      send("ready");
    </script>
  </body>
</html>
