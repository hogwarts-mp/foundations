<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HMP UI</title>
  <style>
    @font-face { font-family:"Cinzel"; src:url("fonts/Cinzel-Variable.ttf") format("truetype"); font-display:swap; }
    @font-face { font-family:"Spectral"; src:url("fonts/Spectral-Regular.ttf") format("truetype"); font-display:swap; }
    :root { color-scheme:dark; --bg:#0a0805; --window:#15120c; --panel:#100d08; --well:#0e0b07; --card:#16120b; --gold:#c9a25a; --bright:#d8b56b; --heading:#f0e3c2; --ink:#d5c8a9; --data:#c2b291; --muted:#9c8f74; --faint:#6f6553; --line:rgba(201,162,90,.30); --hair:rgba(201,162,90,.14); --blue:#92b6c0; --green:#a3bd82; --amber:#d4ad68; --red:#d2876e; --cinzel:"Cinzel",Georgia,serif; --spectral:"Spectral",Georgia,serif; --mono:ui-monospace,"Cascadia Code",Consolas,monospace; }
    * { box-sizing:border-box; }
    * { scrollbar-width:thin; scrollbar-color:rgba(201,162,90,.30) transparent; }
    ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-track { background:rgba(0,0,0,.22); border-radius:5px; } ::-webkit-scrollbar-thumb { background:rgba(201,162,90,.30); border:2px solid transparent; background-clip:padding-box; border-radius:5px; } ::-webkit-scrollbar-thumb:hover { background:rgba(201,162,90,.55); background-clip:padding-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; color:var(--ink); font-family:var(--spectral); pointer-events:none; }
    button,input,textarea { font:inherit; }
    #toasts { position:fixed; top:24px; right:24px; width:min(380px,calc(100vw - 48px)); display:grid; gap:10px; z-index:20; }
    .toast { pointer-events:none; position:relative; padding:14px 16px 14px 18px; border:1px solid var(--line); border-radius:5px; background:linear-gradient(145deg,rgba(21,18,12,.98),rgba(10,8,5,.98)); box-shadow:0 18px 48px rgba(0,0,0,.5); animation:arrive .2s ease-out; overflow:hidden; }
    .toast::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--blue); }
    .toast.success::before { background:var(--green); }.toast.warning::before{background:var(--amber)}.toast.error::before{background:var(--red)}
    .toast strong { display:block; margin-bottom:4px; color:var(--heading); font-family:var(--cinzel); font-size:12px; letter-spacing:.08em; }.toast p{margin:0;color:var(--ink);line-height:1.45}
    .toast.leave { animation:leave .18s ease-in forwards; }
    #overlay { position:fixed; inset:0; display:none; place-items:center; padding:28px; background:radial-gradient(900px 600px at 50% 22%,rgba(201,162,90,.06),transparent 60%),rgba(4,3,2,.68); z-index:10; pointer-events:auto; }
    #overlay.open { display:grid; }
    #overlay.transitioning .panel { visibility:hidden; }
    .panel { width:min(560px,calc(100vw - 40px)); max-height:min(760px,calc(100vh - 48px)); overflow:auto; padding:26px 30px; border:1px solid var(--hair); border-radius:6px; background:var(--window); box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px rgba(201,162,90,.08); }
    .eyebrow { display:flex; align-items:center; gap:10px; color:#b89a64; font-family:var(--cinzel); text-transform:uppercase; letter-spacing:.32em; font-size:10px; margin-bottom:7px; }
    .eyebrow::before { content:""; width:8px; height:8px; flex:none; background:var(--bright); transform:rotate(45deg); }
    h1 { margin:0; color:var(--heading); font-family:var(--cinzel); font-size:24px; font-weight:600; letter-spacing:.06em; line-height:1.25; }
    .content { margin:12px 0 0; color:#bcae93; line-height:1.6; white-space:pre-wrap; }
    .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
    button { cursor:pointer; min-height:38px; padding:9px 15px; color:var(--data); border:1px solid rgba(201,162,90,.25); border-radius:4px; background:transparent; font-family:var(--cinzel); font-size:12px; letter-spacing:.10em; }
    button:hover:not(:disabled),button:focus-visible { border-color:rgba(201,162,90,.5); outline:none; background:rgba(201,162,90,.08); color:var(--heading); }
    button.primary { color:#1a1306; border-color:var(--gold); background:linear-gradient(180deg,#dcb96e,#c19a4e); box-shadow:0 6px 18px rgba(201,162,90,.22); font-weight:600; }
    button.danger { border-color:rgba(165,75,65,.5); color:var(--red); }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .fields { display:grid; gap:15px; margin-top:18px; }
    label.field { display:grid; gap:7px; color:var(--data); font-family:var(--cinzel); font-size:13px; letter-spacing:.07em; }
    .hint { color:var(--muted); font-family:var(--spectral); font-size:12px; letter-spacing:0; line-height:1.4; }
    input,textarea { width:100%; color:var(--ink); border:1px solid rgba(201,162,90,.18); border-radius:4px; background:var(--well); padding:10px 12px; outline:none; font-family:var(--spectral); letter-spacing:0; }
    input::placeholder,textarea::placeholder { color:var(--faint); }
    input:focus,textarea:focus { border-color:rgba(201,162,90,.42); box-shadow:0 0 0 2px rgba(201,162,90,.08); }
    textarea { min-height:112px; resize:vertical; }
    .check { display:flex!important; grid-template-columns:none!important; align-items:center; gap:10px!important; }.check input{width:auto}
    .range { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:14px; }
    .range input { -webkit-appearance:none; appearance:none; height:22px; padding:0; border:0; background:transparent; box-shadow:none; cursor:pointer; }
    .range input:focus { box-shadow:none; }
    .range input::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:linear-gradient(90deg,var(--gold) var(--fill,0%),#2a241a var(--fill,0%)); }
    .range input::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border-radius:50%; border:1px solid #1a1306; background:var(--bright); box-shadow:0 0 0 3px rgba(201,162,90,.15); }
    .range input:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 4px rgba(201,162,90,.35); }
    .range output { min-width:72px; text-align:right; color:var(--data); font-family:var(--mono); font-size:12px; letter-spacing:0; font-variant-numeric:tabular-nums; }
    .select-wrap { position:relative; width:100%; min-width:180px; font-family:var(--spectral); letter-spacing:0; }
    .select-button { width:100%; display:flex; align-items:center; justify-content:space-between; text-align:left; color:var(--ink); background:var(--well); border:1px solid rgba(201,162,90,.18); padding:10px 12px; font-family:var(--spectral); font-size:13px; letter-spacing:0; }
    .select-button::after { content:""; width:0; height:0; flex:none; margin-left:10px; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--muted); }
    .select-wrap.open .select-button { border-color:rgba(201,162,90,.42); }
    .select-wrap.invalid .select-button { border-color:rgba(165,75,65,.7); box-shadow:0 0 0 2px rgba(165,75,65,.1); }
    .select-menu { display:none; position:fixed; z-index:40; overflow-y:auto; padding:4px; background:var(--window); border:1px solid rgba(201,162,90,.3); border-radius:4px; box-shadow:0 14px 34px rgba(0,0,0,.65); }
    .select-wrap.open .select-menu { display:block; }
    .select-search { position:sticky; top:0; z-index:1; margin-bottom:4px; background:#17140f; }
    .select-results { display:grid; gap:1px; }
    .select-option { display:grid; gap:2px; width:100%; min-height:34px; text-align:left; border:0; padding:8px 10px; color:var(--ink); background:transparent; font-family:var(--spectral); font-size:13px; letter-spacing:0; }
    .select-option-description,.select-empty { color:var(--muted); font-family:var(--mono); font-size:10px; line-height:1.35; }
    .select-empty { padding:10px; }
    .select-option:hover,.select-option:focus-visible { color:var(--heading); background:rgba(201,162,90,.12); }
    .select-option.on { color:#ecdcb7; background:rgba(201,162,90,.18); }
    .options { display:grid; gap:9px; margin-top:18px; }
    .option { width:100%; text-align:left; padding:13px 14px; display:grid; gap:4px; background:var(--card); border-color:var(--hair); font-family:var(--spectral); letter-spacing:0; }
    .option.has-icon { grid-template-columns:48px minmax(0,1fr); align-items:center; column-gap:12px; }
    .option-icon { width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 4px 7px #000); }
    .option-body { min-width:0; display:grid; gap:4px; }
    .option .title { color:var(--heading); font-family:var(--cinzel); font-size:12px; letter-spacing:.06em; }.option .description{color:var(--muted);font-size:13px;line-height:1.4}.option.error{border-color:rgba(165,75,65,.5)}.option.success{border-color:rgba(125,155,100,.45)}.option.warning{border-color:rgba(201,162,90,.42)}
    .metadata { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:4px; color:var(--data); font-family:var(--mono); font-size:11px; }.metadata b{color:var(--gold);font-weight:normal}
    .progress-track { height:8px; margin-top:22px; overflow:hidden; border:1px solid var(--hair); border-radius:3px; background:#2a241a; }
    #progress-fill { height:100%; width:0; background:linear-gradient(90deg,#846a35,var(--gold)); transition:width .08s linear; }
    #progress-time { margin-top:9px; color:var(--muted); text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
    @keyframes arrive { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:none} } @keyframes leave{to{opacity:0;transform:translateX(18px)}}
  </style>
</head>
<body>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlay"><section class="panel" id="panel" role="dialog" aria-modal="true"></section></div>
  <script>
    const toasts=document.querySelector("#toasts"),overlay=document.querySelector("#overlay"),panel=document.querySelector("#panel");
    let current=null,progressFrame=0,toastCount=0;
    const send=(name,payload={})=>{try{callEvent(name,JSON.stringify(payload))}catch(_){}};
    const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=String(text);return el};
    const add=(parent,...children)=>{for(const child of children)if(child)parent.appendChild(child);return parent};
    function heading(title,content){const eyebrow=node("div","eyebrow","HMP Foundations");const h=node("h1","",title);const p=content?node("p","content",content):null;add(panel,eyebrow,h,p)}
    function actions(cancelLabel,confirmLabel,onConfirm,canCancel=true){const row=node("div","actions");if(canCancel){const cancel=node("button","",cancelLabel||"Cancel");cancel.onclick=()=>finish(current?.type==="alert"?"cancel":current?.type==="progress"?false:null);row.appendChild(cancel)}if(confirmLabel){const confirm=node("button","primary",confirmLabel);confirm.onclick=onConfirm;row.appendChild(confirm);setTimeout(()=>confirm.focus(),0)}panel.appendChild(row)}
    function finish(result){if(!current)return;const id=current.id;current=null;cancelAnimationFrame(progressFrame);progressFrame=0;closeSelects();overlay.classList.add("transitioning");panel.replaceChildren();send("response",{id,result})}

    function closeSelects(except=null){document.querySelectorAll(".select-wrap.open").forEach(wrap=>{if(wrap!==except){wrap.classList.remove("open");wrap.querySelector(".select-button")?.setAttribute("aria-expanded","false")}})}
    function selectControl(field,onPick){
      const options=Array.isArray(field.options)?field.options:[],searchable=field.searchable===true,wrap=node("div","select-wrap"),button=node("button","select-button"),face=node("span","select-face"),menu=node("div","select-menu"),results=node("div","select-results"),value=node("input"),search=searchable?node("input","select-search"):null;
      button.type="button";button.setAttribute("aria-haspopup","listbox");button.setAttribute("aria-expanded","false");menu.setAttribute("role","listbox");value.type="hidden";value.name=field.name;
      if(search){search.type="text";search.placeholder=field.placeholder||"Search options…";search.autocomplete="off";search.onclick=event=>event.stopPropagation()}
      let index=options.findIndex(option=>String(option.value)===String(field.default));if(index<0)index=searchable?-1:options.length?0:-1;
      const paint=()=>{const current=options[index];face.textContent=current?current.label:(field.placeholder||"Choose an option");value.value=current?String(current.value):"";if(current)wrap.classList.remove("invalid");results.querySelectorAll(".select-option").forEach(item=>{const on=Number(item.dataset.index)===index;item.classList.toggle("on",on);item.setAttribute("aria-selected",String(on))})};
      const choose=(i,close=true)=>{if(i<0||i>=options.length)return;const changed=i!==index;index=i;paint();if(changed&&onPick)onPick(value.value);if(close){wrap.classList.remove("open");button.setAttribute("aria-expanded","false");button.focus()}};
      const render=()=>{const query=String(search?.value||"").trim().toLowerCase(),matches=[];for(let i=0;i<options.length;i++){const option=options[i],haystack=`${option.label} ${option.value} ${option.description||""}`.toLowerCase();if(!query||haystack.includes(query))matches.push(i)}results.replaceChildren();for(const i of matches.slice(0,80)){const option=options[i],item=node("button","select-option");item.type="button";item.dataset.index=String(i);item.setAttribute("role","option");add(item,node("span","select-option-label",option.label),option.description?node("span","select-option-description",option.description):null);item.onclick=event=>{event.stopPropagation();choose(i)};results.appendChild(item)}if(!matches.length)results.appendChild(node("div","select-empty","No matching options."));else if(matches.length>80)results.appendChild(node("div","select-empty",`Showing 80 of ${matches.length} matches. Refine your search.`));paint()};
      const position=()=>{const rect=button.getBoundingClientRect(),desired=searchable?330:Math.min(220,Math.max(42,options.length*35+8)),below=window.innerHeight-rect.bottom-8,above=rect.top-8,useAbove=below<Math.min(120,desired)&&above>below,available=Math.max(72,useAbove?above:below);menu.style.left=`${Math.round(rect.left)}px`;menu.style.width=`${Math.round(rect.width)}px`;menu.style.maxHeight=`${Math.min(desired,available)}px`;menu.style.top=`${Math.round(useAbove?rect.top-Math.min(desired,available)-4:rect.bottom+4)}px`};
      if(search){search.oninput=render;search.onkeydown=event=>{if(event.key==="Escape"){event.preventDefault();wrap.classList.remove("open");button.setAttribute("aria-expanded","false");button.focus()}else if(event.key==="ArrowDown"){event.preventDefault();results.querySelector(".select-option")?.focus()}else if(event.key==="Enter"){const first=results.querySelector(".select-option");if(first){event.preventDefault();choose(Number(first.dataset.index))}}};menu.append(search,results)}else menu.appendChild(results);render();
      button.appendChild(face);button.onclick=event=>{event.stopPropagation();const opening=!wrap.classList.contains("open");closeSelects(wrap);wrap.classList.toggle("open",opening);button.setAttribute("aria-expanded",String(opening));if(opening){position();if(search){search.value="";render();setTimeout(()=>search.focus(),0)}}};
      button.onkeydown=event=>{if(event.key==="ArrowDown"){event.preventDefault();choose(Math.min(options.length-1,index+1),false)}else if(event.key==="ArrowUp"){event.preventDefault();choose(Math.max(0,index-1),false)}else if(event.key==="Enter"||event.key===" "){event.preventDefault();if(wrap.classList.contains("open"))choose(index,true);else button.click()}else if(event.key==="Escape"){event.preventDefault();wrap.classList.remove("open");button.setAttribute("aria-expanded","false")}};

    }
    const decimals=step=>{const text=String(step??1),dot=text.indexOf(".");return dot<0?0:Math.min(4,text.length-dot-1)};
    function rangeControl(field,live){const wrap=node("div","range"),input=node("input"),out=node("output");input.type="range";input.name=field.name;input.min=String(field.min);input.max=String(field.max);if(field.step!==undefined)input.step=String(field.step);input.value=String(field.default??field.min);const paint=()=>{const span=field.max-field.min,ratio=span>0?(Number(input.value)-field.min)/span:0;input.style.setProperty("--fill",`${Math.round(ratio*1000)/10}%`);out.textContent=`${Number(input.value).toFixed(decimals(field.step))}${field.unit?` ${field.unit}`:""}`};input.addEventListener("input",()=>{paint();live?.(field,Number(input.value),true)});paint();wrap.append(input,out);return wrap}
    function fieldControl(field,live){if(field.type==="select")return selectControl(field,live?value=>live(field,value):null);if(field.type==="range")return rangeControl(field,live);let input;if(field.type==="textarea")input=node("textarea");else{input=node("input");input.type=field.type==="number"?"number":field.type==="checkbox"?"checkbox":field.type==="password"?"password":"text"}input.name=field.name;if(field.placeholder)input.placeholder=field.placeholder;if(field.required)input.required=true;if(field.min!==undefined)input.min=String(field.min);if(field.max!==undefined)input.max=String(field.max);if(field.step!==undefined)input.step=String(field.step);if(field.type==="checkbox")input.checked=field.default===true;else if(field.default!==undefined)input.value=String(field.default);if(live&&field.type==="checkbox")input.addEventListener("change",()=>live(field,input.checked));else if(live&&field.type==="number")input.addEventListener("change",()=>{if(input.value!==""&&input.checkValidity())live(field,Number(input.value))});return input}
    // Live dialogs report edits as they happen; a dragged slider is held to one report per 100 ms, its last value always sent.
    function liveSender(id){const last=new Map(),timers=new Map();const emit=(field,value)=>{if(current?.id===id)send("change",{id,name:field.name,value})};return(field,value,throttle=false)=>{clearTimeout(timers.get(field.name));if(!throttle){emit(field,value);return}const now=performance.now(),wait=100-(now-(last.get(field.name)||0));if(wait<=0){last.set(field.name,now);emit(field,value)}else timers.set(field.name,setTimeout(()=>{last.set(field.name,performance.now());emit(field,value)},wait))}}
    function renderInput(payload){heading(payload.title);const live=payload.live?liveSender(current.id):null;const form=node("form","fields");for(const field of payload.fields||[]){const label=node("label",field.type==="checkbox"?"field check":"field");const control=fieldControl(field,live);if(field.type==="checkbox")add(label,control,node("span","",field.label));else add(label,node("span","",field.label),field.description?node("span","hint",field.description):null,control);form.appendChild(label)}panel.appendChild(form);const submit=()=>{if(!form.reportValidity())return;for(const field of payload.fields||[]){const control=form.elements.namedItem(field.name);if(field.type==="select"&&field.required&&!control.value){const wrap=control.closest(".select-wrap");wrap?.classList.add("invalid");wrap?.querySelector(".select-button")?.focus();return}}const result={};for(const field of payload.fields||[]){const control=form.elements.namedItem(field.name);result[field.name]=field.type==="checkbox"?control.checked:field.type==="number"||field.type==="range"?Number(control.value):control.value}finish(result)};form.onsubmit=e=>{e.preventDefault();submit()};actions(payload.cancelLabel,payload.submitLabel,submit,payload.allowCancel!==false)}
    function renderContext(payload){heading(payload.title,payload.description);const list=node("div","options");for(const option of payload.options||[]){const button=node("button",`option ${option.tone||""} ${option.icon?"has-icon":""}`);button.disabled=option.disabled===true;const body=node("span","option-body");add(body,node("span","title",option.title),option.description?node("span","description",option.description):null);if(option.metadata?.length){const meta=node("span","metadata");for(const item of option.metadata){const part=node("span");add(part,node("b","",`${item.label}: `),document.createTextNode(item.value));meta.appendChild(part)}body.appendChild(meta)}if(option.icon){const image=node("img","option-icon");image.src=option.icon;image.alt="";image.onerror=()=>image.remove();button.appendChild(image)}button.appendChild(body);button.onclick=()=>finish(option.id);list.appendChild(button)}panel.appendChild(list);actions(payload.cancelLabel,null,null,payload.canClose!==false)}
    function renderProgress(payload){heading("Please wait",payload.label);const track=node("div","progress-track"),fill=node("div");fill.id="progress-fill";track.appendChild(fill);const time=node("div","progress-time");panel.append(track,time);const began=performance.now();const tick=now=>{const elapsed=Math.max(0,now-began),ratio=Math.min(1,elapsed/payload.duration);fill.style.width=`${ratio*100}%`;time.textContent=`${Math.ceil(Math.max(0,payload.duration-elapsed)/1000)}s`;if(ratio>=1)finish(true);else progressFrame=requestAnimationFrame(tick)};progressFrame=requestAnimationFrame(tick);actions(payload.cancelLabel,null,null,payload.canCancel===true)}
    function renderRequest(request){if(!request?.id||current)return;current=request;panel.replaceChildren();overlay.classList.remove("transitioning");overlay.classList.add("open");if(request.type==="alert")renderAlert(request.payload);else if(request.type==="input")renderInput(request.payload);else if(request.type==="context")renderContext(request.payload);else if(request.type==="progress")renderProgress(request.payload)}

    window.addEventListener("request",event=>renderRequest(event.detail));window.addEventListener("notify",event=>notify(event.detail||{}));window.addEventListener("clear",()=>{if(current){cancelAnimationFrame(progressFrame);current=null}closeSelects();overlay.classList.remove("open","transitioning");panel.replaceChildren()});
    document.addEventListener("click",()=>closeSelects());panel.addEventListener("scroll",()=>closeSelects());
    window.addEventListener("keydown",event=>{if(event.key!=="Escape"||!current)return;if(document.querySelector(".select-wrap.open")){event.preventDefault();closeSelects();return}const p=current.payload||{};const allowed=current.type==="alert"?p.cancel!==false:current.type==="input"?p.allowCancel!==false:current.type==="context"?p.canClose!==false:current.type==="progress"?p.canCancel===true:false;if(allowed){event.preventDefault();finish(current.type==="alert"?"cancel":current.type==="progress"?false:null)}});
    const demo=new URLSearchParams(location.search).get("dev");
    if(demo==="alert")renderRequest({id:"dev",type:"alert",payload:{title:"Confirm your choice",content:"This is the shared HMP alert surface. It keeps domain screens independent while giving every resource the same interaction language.",confirmLabel:"Confirm",cancelLabel:"Go back",cancel:true}});
    else if(demo==="input")renderRequest({id:"dev",type:"input",payload:{title:"Register an owl delivery",submitLabel:"Save delivery",cancelLabel:"Cancel",allowCancel:true,fields:[{name:"recipient",label:"Recipient",type:"text",placeholder:"Witch or wizard",required:true,description:"The name shown on the parcel."},{name:"route",label:"Delivery route",type:"select",default:"owlery",options:[{label:"Hogwarts Owlery",value:"owlery"},{label:"Hogsmeade Post",value:"hogsmeade"}]},{name:"count",label:"Number of parcels",type:"number",default:1,min:1,max:12},{name:"weight",label:"Parcel weight",type:"range",default:4,min:0,max:20,step:0.5,unit:"kg"},{name:"urgent",label:"Priority delivery",type:"checkbox",default:true},{name:"notes",label:"Delivery notes",type:"textarea",placeholder:"Optional instructions"}]}});
    else if(demo==="context")renderRequest({id:"dev",type:"context",payload:{title:"Potion station",description:"Choose an action for the selected cauldron.",canClose:true,cancelLabel:"Close",options:[{id:"brew",title:"Brew Wiggenweld",icon:"fw://resources/hmp-inventory/dist/icons/potion.svg",description:"Uses one Horklump Juice and Dittany Leaves.",tone:"success",metadata:[{label:"Time",value:"15 seconds"},{label:"Yield",value:"1 potion"}]},{id:"collect",title:"Collect ingredients",description:"Move finished ingredients to your inventory."},{id:"locked",title:"Advanced recipes",description:"Requires a higher potion skill.",disabled:true,tone:"warning"}]}});
    else if(demo==="progress")renderRequest({id:"dev",type:"progress",payload:{label:"Brewing Wiggenweld…",duration:15000,canCancel:true,cancelLabel:"Stop brewing"}});
    else if(demo==="notify"){notify({title:"Owl Post",description:"A new letter has arrived.",tone:"success",duration:30000});notify({description:"Your inventory is nearly full.",tone:"warning",duration:30000})}
    send("ready");
  </script>
</body>
</html>
