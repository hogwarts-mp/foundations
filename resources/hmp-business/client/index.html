<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    @font-face{font-family:"Cinzel";src:url("fw://resources/hmp-ui/dist/fonts/Cinzel-Variable.ttf") format("truetype");font-display:swap}
    @font-face{font-family:"Spectral";src:url("fw://resources/hmp-ui/dist/fonts/Spectral-Regular.ttf") format("truetype");font-display:swap}
    :root{color-scheme:dark;--bg:#0a0805;--nav:#100d08;--surface:#15120c;--well:#0e0b07;--hover:#1c170e;--ink:#d5c8a9;--heading:#f0e3c2;--muted:#9c8f74;--faint:#716654;--gold:#c9a25a;--line:rgba(201,162,90,.28);--hair:rgba(201,162,90,.13);--green:#a3bd82;--amber:#d4ad68;--red:#d2876e;--blue:#92b6c0}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:rgba(4,3,2,.72);color:var(--ink);font-family:"Spectral",Georgia,serif}button,input,select,textarea{font:inherit}
    body{display:grid;place-items:center;padding:3vh 3vw}.shell{width:min(1180px,94vw);height:min(760px,92vh);display:grid;grid-template-columns:236px minmax(0,1fr);overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:7px;box-shadow:0 30px 90px rgba(0,0,0,.68)}
    .sidebar{min-height:0;display:flex;flex-direction:column;gap:22px;padding:24px 18px;background:var(--nav);border-right:1px solid var(--hair)}.brand{display:flex;gap:13px;align-items:center}.mark{width:18px;height:18px;flex:none;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 18px rgba(201,162,90,.24)}.brand strong,h1,h2,h3,.eyebrow,.nav-label,.button{font-family:"Cinzel",Georgia,serif;font-weight:500}.brand strong{display:block;color:var(--heading);letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .business-picker{width:100%;color:var(--heading);background:var(--well);border:1px solid var(--line);border-radius:4px;padding:10px 11px}.nav{display:grid;gap:4px}.nav-label{color:var(--faint);font-size:10px;letter-spacing:.17em;text-transform:uppercase;padding:0 10px 8px}.nav button{width:100%;min-height:42px;text-align:left;color:var(--muted);background:transparent;border:0;border-radius:4px;padding:9px 12px;cursor:pointer}.nav button:hover{color:var(--heading);background:var(--hover)}.nav button.active{color:var(--heading);background:rgba(201,162,90,.14);border-left:3px solid var(--gold);padding-left:9px}.role{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--hair);color:var(--muted);font-size:12px}.role strong{display:block;color:var(--heading);font-weight:400;margin-top:3px}
    .page{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.topbar{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 26px;border-bottom:1px solid var(--hair)}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:10px;margin-bottom:4px}.title-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{color:var(--heading);font-size:22px;line-height:1.2;margin:0;letter-spacing:.04em}.status{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.status.closed{color:var(--amber)}.actions{display:flex;gap:9px;flex-wrap:wrap}.button{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 13px;font-size:11px;letter-spacing:.05em}.button:hover,.button:focus-visible{color:var(--heading);background:var(--hover)}.button.primary{color:#1a1306;background:linear-gradient(180deg,#dcb96e,#c19a4e);border-color:var(--gold);font-weight:600}.button.danger{color:var(--red);border-color:rgba(210,135,110,.45)}.button:disabled{opacity:.45;cursor:not-allowed}.main{min-height:0;overflow:auto;padding:24px 26px 30px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}.stat{padding:16px;background:var(--well);border:1px solid var(--hair);border-radius:5px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;color:var(--heading);font-size:23px;font-weight:500;margin-top:5px;font-variant-numeric:tabular-nums}.stat small{color:var(--green)}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:22px 0 12px}.section-head:first-child{margin-top:0}.section-head h2{color:var(--heading);font-size:16px;margin:0}.section-head p{color:var(--muted);margin:4px 0 0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.counter{display:grid;gap:12px;padding:16px;text-align:left;color:inherit;cursor:pointer;background:var(--well);border:1px solid var(--hair);border-radius:5px}.counter:hover,.counter.selected{border-color:var(--line);background:var(--hover)}.counter-top{display:flex;justify-content:space-between;gap:14px}.counter h3{color:var(--heading);font-size:14px;margin:0 0 3px}.counter p{color:var(--muted);font-size:12px;margin:0}.badge{display:inline-flex;height:max-content;color:var(--green);background:rgba(163,189,130,.12);padding:4px 7px;border-radius:999px;font-size:11px}.badge.closed{color:var(--amber);background:rgba(212,173,104,.12)}.meta{display:flex;flex-wrap:wrap;gap:7px 14px;color:var(--muted);font-size:12px}.table-wrap{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{color:var(--faint);font:500 10px "Cinzel",Georgia,serif;text-transform:uppercase;letter-spacing:.09em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}td{color:var(--ink);padding:12px;border-bottom:1px solid var(--hair);font-size:13px}td strong{display:block;color:var(--heading);font-weight:500}td small{display:block;color:var(--muted)}.num{text-align:right;font-variant-numeric:tabular-nums}.row-action{color:var(--gold);border:0;background:transparent;cursor:pointer;padding:6px}.two-column{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.75fr);gap:18px}.inspector{background:var(--well);border:1px solid var(--hair);border-radius:5px;padding:18px;align-self:start}.inspector h2{color:var(--heading);font-size:16px;margin:0 0 4px}.inspector>p{color:var(--muted);font-size:12px;margin:0 0 16px}.form{display:grid;gap:13px}.field{display:grid;gap:6px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 10px;outline:none}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(201,162,90,.55)}.check{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:13px}.check input{width:auto}.callout{color:var(--blue);background:rgba(146,182,192,.09);border-left:3px solid var(--blue);padding:11px 12px;font-size:12px;line-height:1.45}.empty{color:var(--muted);padding:42px 18px;text-align:center;border:1px dashed var(--line)}
    .modal-layer:empty{display:none}.modal-layer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.68)}.modal{width:min(520px,100%);max-height:min(720px,90vh);overflow:auto;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;box-shadow:0 28px 70px rgba(0,0,0,.6)}.modal h2{color:var(--heading);font-size:18px;margin:0}.modal>p{color:var(--muted);margin:6px 0 18px;font-size:13px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;z-index:30;right:28px;top:24px;width:min(380px,calc(100vw - 56px));padding:14px 16px;color:var(--heading);background:var(--surface);border:1px solid rgba(210,135,110,.55);border-left:4px solid var(--red);border-radius:5px;box-shadow:0 18px 48px rgba(0,0,0,.55)}
    @media(max-width:820px){body{padding:0}.shell{width:100vw;height:100vh;border-radius:0;grid-template-columns:1fr}.sidebar{padding:13px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--hair)}.brand,.role{display:none}.nav{display:flex;overflow-x:auto}.nav-label{display:none}.nav button{width:auto;flex:none}.business-picker{width:min(300px,100%)}.topbar{padding:16px}.main{padding:17px}.summary,.grid,.two-column{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <section class="shell" aria-label="Business management">
    <aside class="sidebar"><div class="brand"><span class="mark" aria-hidden="true"></span><div><strong>HMP Foundations</strong><small>Business ledger</small></div></div><select class="business-picker" id="business-picker" aria-label="Select business"></select><nav class="nav" id="nav" aria-label="Business sections"><span class="nav-label">Manage</span><button data-page="overview" class="active">Overview</button><button data-page="counters">Counters</button><button data-page="catalog">Stock &amp; pricing</button><button data-page="staff">Staff</button><button data-page="ledger">Ledger</button></nav><div class="role">Access<strong id="role">Business manager</strong></div></aside>
    <section class="page"><header class="topbar"><div><div class="eyebrow" id="eyebrow">Business manager</div><div class="title-line"><h1 id="title">Business ledger</h1><span class="status" id="status">Trading</span></div></div><div class="actions" id="top-actions"><button class="button" data-command="refresh">Refresh</button><button class="button" data-command="close">Close</button></div></header><main class="main" id="main"></main></section>
  </section>
  <div class="modal-layer" id="modal-layer"></div><div id="toast-region" aria-live="polite"></div>
  <script>
    const send=(name,payload={})=>{try{callEvent(name,JSON.stringify(payload))}catch(_){}};
    const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    let model={admin:false,businesses:[],business:null,shops:[],offers:[],staff:[],audit:[],items:[],jobs:[],currencies:[],books:null,bounds:{floor:1,ceiling:1000,buybacks:{enabled:false,maxRatio:.5}}};
    let page="overview",selectedShop="",toastTimer=0;
    const main=document.querySelector("#main"),picker=document.querySelector("#business-picker"),modal=document.querySelector("#modal-layer");
    const actionButton=(label,command,kind="")=>`<button type="button" class="button ${kind}" data-command="${command}">${esc(label)}</button>`;
    const shopOf=id=>model.shops.find(shop=>shop.id===id)||model.shops[0]||null;
    const offerOf=(shop,id)=>model.offers.find(offer=>offer.shopId===shop&&offer.id===id)||null;
    function currency(){return model.currency?.symbol||model.currency?.label||model.business?.currency||""}
    function money(value){return `${Number(value||0).toLocaleString()} ${esc(currency())}`.trim()}
    function notify(message){clearTimeout(toastTimer);document.querySelector("#toast-region").innerHTML=`<div class="toast" role="alert">${esc(message)}</div>`;toastTimer=setTimeout(()=>document.querySelector("#toast-region").replaceChildren(),5000)}
    function sendAction(action,values={}){send("action",{action,businessId:model.selectedBusinessId,...values})}
    function setTopActions(extra=""){document.querySelector("#top-actions").innerHTML=`${extra}${actionButton("Refresh","refresh")}${actionButton("Close","close")}`}
    function setHeading(title,eyebrow){document.querySelector("#title").textContent=title;document.querySelector("#eyebrow").textContent=eyebrow;const status=document.querySelector("#status");status.textContent=!model.business?"No business":model.business.enabled===false?"Closed":"Trading";status.classList.toggle("closed",!model.business||model.business.enabled===false)}
    function summaries(){const sales=(model.books?.shops||[]).reduce((sum,shop)=>sum+Number(shop.purchases||0),0),revenue=(model.books?.shops||[]).reduce((sum,shop)=>sum+Number(shop.revenue||0)-Number(shop.spent||0),0),low=model.offers.filter(offer=>offer.enabled&&!offer.unlimited&&Number(offer.stock||0)<5).length;return `<div class="summary"><div class="stat"><span>Organization balance</span><strong>${model.books?.balance==null?"—":money(model.books.balance)}</strong><small>${revenue>=0?"+":""}${money(revenue)} today</small></div><div class="stat"><span>Today's trade</span><strong>${sales} sale${sales===1?"":"s"}</strong><small>Across ${model.shops.filter(shop=>shop.enabled).length} open counter${model.shops.filter(shop=>shop.enabled).length===1?"":"s"}</small></div><div class="stat"><span>Stock attention</span><strong>${low} offer${low===1?"":"s"}</strong><small style="color:var(--amber)">Low or empty</small></div></div>`}
    function counterCards(){if(!model.shops.length)return `<div class="empty">No counters have been placed.</div>`;return `<div class="grid">${model.shops.map(shop=>`<button type="button" class="counter ${selectedShop===shop.id?"selected":""}" data-shop="${esc(shop.id)}"><span class="counter-top"><span><h3>${esc(shop.label)}</h3><p>${esc(shop.areaId||shop.regionId||"Unlabelled area")}</p></span><span class="badge ${shop.enabled?"":"closed"}">${shop.enabled?(shop.staffed?"Open · staffed":"Open"):"Closed"}</span></span><span class="meta"><span>${esc(shop.staffing)}</span><span>${shop.vendor?esc(shop.vendor.label||shop.vendor.characterId):"No stand-in"}</span><span>${model.offers.filter(offer=>offer.shopId===shop.id&&offer.enabled).length} offers</span></span></button>`).join("")}</div>`}
    function renderOverview(){setHeading(model.business?.label||"Business ledger",model.admin?"Administrator · business record":"Business manager");setTopActions(model.admin?actionButton("New business","new-business","primary")+(model.business?actionButton("Place counter","place-shop"):""):"");if(!model.business){main.innerHTML=`<div class="empty">${model.admin?"No businesses exist yet.":"You do not manage a business."}<div class="actions" style="justify-content:center;margin-top:16px">${model.admin?actionButton("Create business","new-business","primary"):""}</div></div>`;return}main.innerHTML=`${summaries()}<div class="section-head"><div><h2>Counters</h2><p>Trading state, staffing and shelf health.</p></div></div>${counterCards()}<div class="section-head"><div><h2>Recent activity</h2><p>Audited changes and till movement.</p></div><button class="row-action" data-page="ledger">View ledger</button></div>${auditTable(model.audit.slice(0,4))}`}
    function renderCounters(){setHeading("Counters",model.admin?"Administrator tools":model.business?.label||"Business");setTopActions(model.admin?actionButton("Place counter","place-shop","primary"):"");if(!model.business){main.innerHTML=`<div class="empty">Select or create a business first.</div>`;return}const shop=shopOf(selectedShop);if(shop)selectedShop=shop.id;main.innerHTML=`<div class="two-column"><section><div class="section-head"><div><h2>Trading locations</h2><p>Select a counter to change its policy or stand-in.</p></div></div>${counterCards()}</section><aside class="inspector">${shop?shopInspector(shop):"<h2>No counter selected</h2>"}</aside></div>`}
    function shopInspector(shop){return `<h2>${esc(shop.label)}</h2><p>business:${esc(model.business.id)}:${esc(shop.id)}</p><form class="form" data-action="update-shop"><input type="hidden" name="shopId" value="${esc(shop.id)}"><label class="field">Counter name<input name="label" value="${esc(shop.label)}" required></label><label class="field">Trading policy<select name="staffing"><option value="always" ${shop.staffing==="always"?"selected":""}>Always open</option><option value="staffed" ${shop.staffing==="staffed"?"selected":""}>Staffed only</option><option value="kiosk" ${shop.staffing==="kiosk"?"selected":""}>Kiosk</option></select></label><label class="field">Stand-in character<input name="vendorCharacterId" value="${esc(shop.vendor?.characterId||"")}" placeholder="Leave empty for none"></label><label class="field">Stand-in nameplate<input name="vendorLabel" value="${esc(shop.vendor?.label||"")}"></label><label class="field">Stand-in yaw<input name="vendorYaw" type="number" value="${Number(shop.vendor?.yaw||0)}" min="-360" max="360"></label><label class="field">Staff radius (cm)<input name="staffRadius" type="number" value="${Number(shop.staffRadius)}" min="1"></label>${model.admin?`<label class="field">Prompt radius (cm)<input name="radius" type="number" value="${Number(shop.radius)}" min="1"></label>`:""}<label class="check"><input name="enabled" type="checkbox" ${shop.enabled?"checked":""}> Counter is open</label><button class="button primary" type="submit">Save counter</button></form>${model.admin?`<div class="actions" style="margin-top:14px">${actionButton("Move here","move-shop")}${actionButton(shop.dutyPoint?"Move clock-in here":"Place clock-in here","duty-point")}${shop.dutyPoint?actionButton("Remove clock-in","clear-duty"):""}</div>`:""}`}
    function renderCatalog(){setHeading("Stock & pricing",model.business?.label||"Business");setTopActions(model.business?actionButton("Add offer","add-offer","primary"):"");if(!model.business){main.innerHTML=`<div class="empty">Select or create a business first.</div>`;return}main.innerHTML=`<div class="section-head"><div><h2>Catalog</h2><p>Prices stay inside the server's permitted range; stock remains per counter.</p></div></div><div class="table-wrap"><table><thead><tr><th>Offer</th><th>Counter</th><th class="num">Customer pays</th><th class="num">Shelf</th><th class="num">Max / sale</th><th>Status</th><th></th></tr></thead><tbody>${model.offers.map(offer=>{const shop=shopOf(offer.shopId);return `<tr><td><strong>${esc(offer.label||model.items.find(item=>item.name===offer.item)?.label||offer.item)}</strong><small>${esc(offer.item)}</small></td><td>${esc(shop?.label||offer.shopId)}</td><td class="num">${offer.buyPrice==null?"—":money(offer.buyPrice)}</td><td class="num">${offer.unlimited?"∞":Number(offer.stock||0)}</td><td class="num">${Number(offer.maxQuantity)}</td><td><span class="badge ${offer.enabled?"":"closed"}">${offer.enabled?"Listed":"Retired"}</span></td><td class="num"><button class="row-action" data-offer="${esc(offer.id)}" data-offer-shop="${esc(offer.shopId)}">Edit</button>${offer.unlimited?"":`<button class="row-action" data-stock-action="restock" data-stock="${esc(offer.id)}" data-stock-shop="${esc(offer.shopId)}">Restock</button><button class="row-action" data-stock-action="withdraw" data-stock="${esc(offer.id)}" data-stock-shop="${esc(offer.shopId)}">Withdraw</button>${model.admin?`<button class="row-action" data-stock-action="set-stock" data-stock="${esc(offer.id)}" data-stock-shop="${esc(offer.shopId)}">Set</button>`:""}${model.shops.length>1?`<button class="row-action" data-stock-action="transfer" data-stock="${esc(offer.id)}" data-stock-shop="${esc(offer.shopId)}">Transfer</button>`:""}`}</td></tr>`}).join("")||`<tr><td colspan="7">No offers are listed.</td></tr>`}</tbody></table></div>`}
    function renderStaff(){setHeading("Staff",model.business?.label||"Business");setTopActions(model.business?actionButton("Manage employment","manage-staff","primary"):"");if(!model.business){main.innerHTML=`<div class="empty">Select or create a business first.</div>`;return}main.innerHTML=`<div class="section-head"><div><h2>Employees</h2><p>Who can operate the shop and who is currently covering a counter.</p></div></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Grade</th><th>Permissions</th><th>Duty</th><th class="num">Wage</th></tr></thead><tbody>${model.staff.map(person=>`<tr><td><strong>${esc(person.characterName)}</strong><small>Character #${Number(person.characterId)}</small></td><td>${esc(person.gradeLabel)} · ${Number(person.grade)}</td><td>${esc((person.permissions||[]).join(", ")||"Trade only")}</td><td>${person.duty?`<span class="badge">On duty</span>`:"Off duty"}</td><td class="num">${person.salary==null?"—":money(person.salary)}</td></tr>`).join("")||`<tr><td colspan="5">No employees.</td></tr>`}</tbody></table></div>`}
    function auditTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Action</th><th>Target</th><th>Actor</th><th>Reason</th><th class="num">Time</th></tr></thead><tbody>${rows.map(entry=>`<tr><td><strong>${esc(entry.action)}</strong></td><td>${esc([entry.shopId,entry.offerId].filter(Boolean).join(" / ")||entry.businessId)}</td><td>${entry.actorCharacterId?`#${Number(entry.actorCharacterId)}`:"System"}</td><td>${esc(entry.reason||"—")}</td><td class="num">${new Date(entry.createdAt).toLocaleString()}</td></tr>`).join("")||`<tr><td colspan="5">No ledger entries.</td></tr>`}</tbody></table></div>`}
    function renderLedger(){setHeading("Ledger","Audited history");setTopActions();main.innerHTML=model.business?`${summaries()}<div class="section-head"><div><h2>Business audit</h2><p>Every price, stock, counter and policy change names its actor.</p></div></div>${auditTable(model.audit)}`:`<div class="empty">Select or create a business first.</div>`}
    function render(){picker.innerHTML=model.businesses.map(business=>`<option value="${esc(business.id)}" ${business.id===model.selectedBusinessId?"selected":""}>${esc(business.label)}</option>`).join("");picker.disabled=!model.businesses.length;document.querySelector("#role").textContent=model.admin?"Administrator":"Business manager";document.querySelectorAll("#nav [data-page]").forEach(button=>button.classList.toggle("active",button.dataset.page===page));if(page==="overview")renderOverview();else if(page==="counters")renderCounters();else if(page==="catalog")renderCatalog();else if(page==="staff")renderStaff();else renderLedger()}
    function openModal(title,description,fields,submitLabel,action){modal.innerHTML=`<section class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(description)}</p><form class="form" data-action="${esc(action)}">${fields}<div class="modal-actions">${actionButton("Cancel","close-modal") }<button class="button primary" type="submit">${esc(submitLabel)}</button></div></form></section>`}
    function optionRows(rows,value,label){return rows.map(row=>`<option value="${esc(row[value])}">${esc(row[label]||row[value])}</option>`).join("")}
    function newBusiness(){openModal("Create a business","Bind the business to an existing job and organization account.",`<label class="field">Business name<input name="label" required></label><label class="field">Business id<input name="id" required placeholder="pippins"></label><label class="field">Job<select name="jobId">${optionRows(model.jobs,"id","label")}</select></label><label class="field">Currency<select name="currency">${optionRows(model.currencies,"id","label")}</select></label>`,"Create business","create-business")}
    function placeShop(){openModal("Place a counter","Stand where customers should see the shop prompt; your current area and position will be captured.",`<label class="field">Counter name<input name="label" required></label><label class="field">Counter id<input name="id" required placeholder="hogsmeade"></label><label class="field">Trading policy<select name="staffing"><option value="staffed">Staffed only</option><option value="always">Always open</option><option value="kiosk">Kiosk</option></select></label><label class="field">Prompt radius (cm)<input name="radius" type="number" value="180" min="1"></label><label class="field">Staff radius (cm)<input name="staffRadius" type="number" value="1000" min="1"></label><label class="check"><input name="dutyPoint" type="checkbox"> Place a clock-in point here too</label>`,"Capture & place","place-shop")}
    function offerModal(shopId,offerId){const offer=offerOf(shopId,offerId),item=offer?.item||model.items[0]?.name||"";openModal(offer?"Edit offer":"Add an offer","Choose what this counter sells and how much customers pay.",`<label class="field">Counter<select name="shopId">${model.shops.map(shop=>`<option value="${esc(shop.id)}" ${shop.id===(shopId||selectedShop)?"selected":""}>${esc(shop.label)}</option>`).join("")}</select></label><label class="field">Item<select name="item">${model.items.map(entry=>`<option value="${esc(entry.name)}" ${entry.name===item?"selected":""}>${esc(entry.label)}</option>`).join("")}</select></label><input type="hidden" name="offerId" value="${esc(offer?.id||"")}"><label class="field">Customers pay<input name="buyPrice" type="number" value="${offer?.buyPrice??model.bounds.floor}" min="${Number(model.bounds.floor)}" max="${Number(model.bounds.ceiling)}" required></label>${model.bounds.buybacks?.enabled?`<label class="field">Buyback share<input name="buybackRatio" type="number" step="0.01" value="${offer?.buybackRatio??""}" min="0" max="${Number(model.bounds.buybacks.maxRatio)}"></label>`:""}<label class="field">Maximum per purchase<input name="maxQuantity" type="number" value="${offer?.maxQuantity||10}" min="1" required></label>${model.admin?`<label class="check"><input name="unlimited" type="checkbox" ${offer?.unlimited?"checked":""}> Unlimited stock</label>${offer?"":`<label class="field">Initial stock<input name="stock" type="number" value="0" min="0"></label>`}`:""}${offer?`<label class="check"><input name="enabled" type="checkbox" ${offer.enabled?"checked":""}> Offer is listed</label>`:""}`,offer?"Save offer":"Add offer","set-offer")}
    function stockModal(action,shopId,offerId){const offer=offerOf(shopId,offerId),labels={restock:"Restock from inventory",withdraw:"Withdraw to inventory","set-stock":"Set shelf stock"};openModal(labels[action]||"Move stock",offer?.label||model.items.find(item=>item.name===offer?.item)?.label||offerId,`<input type="hidden" name="shopId" value="${esc(shopId)}"><input type="hidden" name="offerId" value="${esc(offerId)}"><label class="field">Quantity<input name="quantity" type="number" value="1" min="${action==="set-stock"?0:1}" required></label>`,"Confirm",action)}
    function transferModal(shopId,offerId){const destinations=model.shops.filter(shop=>shop.id!==shopId&&model.offers.some(offer=>offer.shopId===shop.id&&offer.id===offerId));openModal("Transfer stock","Move shelf stock to another counter.",`<input type="hidden" name="shopId" value="${esc(shopId)}"><input type="hidden" name="offerId" value="${esc(offerId)}"><label class="field">Destination<select name="toShopId">${destinations.map(shop=>`<option value="${esc(shop.id)}">${esc(shop.label)}</option>`).join("")}</select></label><label class="field">Quantity<input name="quantity" type="number" value="1" min="1" required></label>`,"Transfer","transfer")}
    function formPayload(form){const values=Object.fromEntries(new FormData(form).entries());for(const input of form.querySelectorAll('input[type="checkbox"]'))values[input.name]=input.checked;return values}
    document.addEventListener("click",event=>{const target=event.target.closest("button");if(!target)return;if(target.dataset.page){page=target.dataset.page;render();return}if(target.dataset.shop){selectedShop=target.dataset.shop;page="counters";render();return}if(target.dataset.offer){offerModal(target.dataset.offerShop,target.dataset.offer);return}if(target.dataset.stock){if(target.dataset.stockAction==="transfer")transferModal(target.dataset.stockShop,target.dataset.stock);else stockModal(target.dataset.stockAction,target.dataset.stockShop,target.dataset.stock);return}const command=target.dataset.command;if(!command)return;if(command==="close")send("close");else if(command==="refresh")send("refresh");else if(command==="close-modal")modal.replaceChildren();else if(command==="new-business")newBusiness();else if(command==="place-shop")placeShop();else if(command==="add-offer")offerModal(selectedShop,"");else if(command==="manage-staff")sendAction("manage-staff");else if(["move-shop","duty-point","clear-duty"].includes(command)){const shop=shopOf(selectedShop);if(shop)sendAction(command==="clear-duty"?"duty-point":command,{shopId:shop.id,clear:command==="clear-duty"})}});
    document.addEventListener("submit",event=>{const form=event.target;if(!(form instanceof HTMLFormElement)||!form.dataset.action)return;event.preventDefault();const values=formPayload(form),action=form.dataset.action;modal.replaceChildren();sendAction(action,values)});
    picker.onchange=()=>sendAction("select",{businessId:picker.value});
    window.addEventListener("model",event=>{model=event.detail||model;if(!selectedShop||!model.shops.some(shop=>shop.id===selectedShop))selectedShop=model.shops[0]?.id||"";render()});
    window.addEventListener("actionError",event=>notify(event.detail?.message||"The action could not be completed."));
    window.addEventListener("keydown",event=>{if(event.key!=="Escape")return;if(modal.childElementCount)modal.replaceChildren();else send("close")});
    send("ready");render();
  </script>
</body>
</html>
